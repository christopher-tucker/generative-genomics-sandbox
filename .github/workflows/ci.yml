name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: genomics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demo -d genomics"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r services/model_server/requirements.txt
          pip install pytest

      - name: Run Python tests
        working-directory: services/model_server
        run: |
          pytest -q

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Run Go tests
        run: |
          cd services/api_gateway
          go test ./... -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install web-client deps (skip if none)
        working-directory: web-client
        run: |
          npm ci || echo "npm ci failed (no package-lock); skipping"

      - name: Build Docker images (smoke)
        run: |
          docker build -t gg-model-server ./services/model_server
          docker build -t gg-api-gateway ./services/api_gateway
