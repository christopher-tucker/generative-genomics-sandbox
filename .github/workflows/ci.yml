name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Python deps
        run: |
          python -m pip install -r services/model_server/requirements.txt
      - name: Run Python tests
        run: |
          pytest -q
