name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r services/model_server/requirements.txt
          pip install pytest

      - name: Run Python tests
        working-directory: services/model_server
        run: pytest -q

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Run Go tests
        working-directory: services/api_gateway
        run: go test ./... -v

      - name: Skip frontend build (for now)
        run: echo "Skipping Node/React build to save CI time and disk"
