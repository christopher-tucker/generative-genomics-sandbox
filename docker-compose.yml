version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: genomics
    ports:
      - "5432:5432"
  model_server:
    build: ./services/model_server
    ports:
      - "8001:8001"
    volumes:
      - ./models:/app/models
  api_gateway:
    build: ./services/api_gateway
    ports:
      - "8080:8080"
    depends_on:
      - model_server
      - db
  web:
    build: ./web-client
    ports:
      - "3000:3000"
